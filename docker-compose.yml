version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=scholar
      - POSTGRES_PASSWORD=scholar_pass
      - POSTGRES_DB=scholarflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
